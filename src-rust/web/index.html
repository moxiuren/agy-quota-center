  <!-- Toast 提示条容器 -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    let accountsData = [];
    let activeAccountId = null;
    let bestAccountId = null;
    let oauthPollTimer = null;

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `px-4 py-3 rounded-xl text-xs font-medium shadow-2xl flex items-center gap-2 border transition-all duration-300 transform translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-emerald-950/90 text-emerald-200 border-emerald-500/50' : 'bg-red-950/90 text-red-200 border-red-500/50'
      }`;
      el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-circle-exclamation text-red-400'}"></i> <span>${msg}</span>`;
      document.getElementById('toast-container').appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    async function loadAccounts() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch('/api/accounts');
        const data = await res.json();
        accountsData = data.accounts || [];
        activeAccountId = data.current_account_id;
        bestAccountId = data.best_account_id;

        renderStats(data);
        renderGrid();
      } catch (err) {
        showToast('拉取账号数据失败: ' + err, 'error');
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function renderStats(data) {
      document.getElementById('stat-total').innerText = accountsData.length;
      
      const active = accountsData.find(a => a.id === activeAccountId);
      const best = accountsData.find(a => a.id === bestAccountId);

      const activeEmail = active ? active.email : '未配置';
      document.getElementById('stat-active').innerText = activeEmail;
      document.getElementById('active-email-nav').innerText = activeEmail;

      document.getElementById('stat-best').innerText = best ? best.email : (active ? active.email : '--');

      let earliestCd = '--';
      let minMinutes = 999999;
      for (const a of accountsData) {
        if (a.quota) {
          if (a.quota.gemini_5h_countdown && a.quota.gemini_5h_countdown !== '满额' && a.quota.gemini_5h_countdown !== '--') {
            earliestCd = `${a.email.split('@')[0]}: ${a.quota.gemini_5h_countdown}`;
          }
        }
      }
      document.getElementById('stat-countdown').innerText = earliestCd;
    }

    function renderGrid() {
      const container = document.getElementById('accounts-grid');
      if (!accountsData.length) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-gray-500">账号池为空，请点击右上角「添加账号」添加 Google 账号凭据。</div>`;
        return;
      }

      container.innerHTML = accountsData.map((acc, idx) => {
        const isActive = (acc.id === activeAccountId);
        const isBest = (bestAccountId && acc.id === bestAccountId && !isActive);

        let cardClass = "glass-card p-5 rounded-2xl flex flex-col justify-between gap-4";
        if (isActive) cardClass += " active-card";
        else if (isBest) cardClass += " best-card";

        let badgeHtml = '';
        if (isActive) {
          badgeHtml = `<span class="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-emerald-950/80 text-emerald-400 border border-emerald-500/40 flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>当前活动</span>`;
        } else if (isBest) {
          badgeHtml = `<span class="px-2.5 py-0.5 text-[11px] font-semibold rounded-full bg-purple-950/80 text-purple-300 border border-purple-500/40 flex items-center gap-1"><i class="fa-solid fa-star text-[10px]"></i> 推荐最高</span>`;
        } else {
          badgeHtml = `<span class="px-2.5 py-0.5 text-[11px] rounded-full bg-gray-800 text-gray-400 border border-gray-700">就绪</span>`;
        }

        const q = acc.quota || {};
        const g5 = Math.round((q.gemini_5h ?? 1.0) * 100);
        const gw = Math.round((q.gemini_weekly ?? 1.0) * 100);
        const c5 = Math.round((q.claude_5h ?? 1.0) * 100);
        const cw = Math.round((q.claude_weekly ?? 1.0) * 100);

        const gCd = q.gemini_5h_countdown || '--';
        const cCd = q.claude_5h_countdown || '--';

        const colorClass = (pct) => {
          if (pct >= 50) return 'from-emerald-500 to-teal-500';
          if (pct >= 20) return 'from-amber-500 to-yellow-500';
          return 'from-rose-500 to-red-500';
        };

        return `
          <div class="${cardClass}">
            <!-- 头部账号信息 -->
            <div class="flex items-start justify-between gap-3">
              <div class="overflow-hidden">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono text-gray-500">#${idx + 1}</span>
                  <div class="font-bold text-sm text-white truncate font-mono" title="${acc.email}">${acc.email}</div>
                </div>
                <div class="text-[11px] text-gray-400 mt-0.5">${acc.name || 'Antigravity User'}</div>
              </div>
              <div class="shrink-0">${badgeHtml}</div>
            </div>

            <!-- 配额进度大盘 -->
            <div class="flex flex-col gap-3 bg-gray-950/60 p-3.5 rounded-xl border border-gray-800/80">
              
              <!-- Gemini 组 -->
              <div class="flex flex-col gap-1.5">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-semibold text-blue-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-sparkles text-[11px]"></i> Gemini 系列
                  </span>
                  <span class="text-[11px] font-mono text-gray-400">
                    5h: <b class="${g5 >= 50 ? 'text-emerald-400' : 'text-amber-400'}">${g5}%</b> (${gCd}) | 周: <b>${gw}%</b>
                  </span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden flex">
                  <div class="bg-gradient-to-r ${colorClass(g5)} h-full rounded-full transition-all duration-500" style="width: ${g5}%"></div>
                </div>
              </div>

              <!-- Claude / GPT 组 -->
              <div class="flex flex-col gap-1.5">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-semibold text-purple-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-brain text-[11px]"></i> Claude & GPT
                  </span>
                  <span class="text-[11px] font-mono text-gray-400">
                    5h: <b class="${c5 >= 50 ? 'text-emerald-400' : 'text-amber-400'}">${c5}%</b> (${cCd}) | 周: <b>${cw}%</b>
                  </span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden flex">
                  <div class="bg-gradient-to-r ${colorClass(c5)} h-full rounded-full transition-all duration-500" style="width: ${c5}%"></div>
                </div>
              </div>

            </div>

            <!-- 底部操作按钮 -->
            <div class="flex items-center gap-2 pt-1 border-t border-gray-800/60">
              ${isActive ? `
                <div class="flex-1 py-2 text-center text-xs font-semibold text-emerald-400 bg-emerald-950/40 rounded-xl border border-emerald-500/20">
                  <i class="fa-solid fa-check mr-1"></i> 当前正在使用的活动凭据
                </div>
              ` : `
                <button onclick="switchAccount('${acc.id}')" class="flex-1 py-2 bg-indigo-600/90 hover:bg-indigo-600 text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition">
                  <i class="fa-solid fa-arrow-right-arrow-left"></i> <span>秒切至此账号</span>
                </button>
              `}
              <button onclick="deleteAccount('${acc.id}', '${acc.email}')" class="px-3 py-2 text-gray-500 hover:text-red-400 hover:bg-red-950/40 rounded-xl text-xs border border-transparent hover:border-red-900/40 transition" title="从账号池移除">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function switchAccount(accId) {
      try {
        const res = await fetch('/api/switch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accId })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`已成功切换活动账号为: ${data.email}`);
          loadAccounts();
        } else {
          showToast(`切换失败: ${data.message}`, 'error');
        }
      } catch (err) {
        showToast('请求切换异常: ' + err, 'error');
      }
    }

    async function triggerAutoSwitch() {
      try {
        const res = await fetch('/api/auto-switch', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(`已智能秒切至最高额度账号: ${data.email}`);
          loadAccounts();
        } else {
          showToast(data.message || '无需切换', 'error');
        }
      } catch (err) {
        showToast('智能切号异常: ' + err, 'error');
      }
    }

    async function snapshotCurrent() {
      const alias = prompt('请输入此账号的备注名称 (直接确认则使用默认):', '');
      if (alias === null) return;
      try {
        const res = await fetch('/api/save-current', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ alias: alias.trim() })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`成功将活动账号 [${data.email}] 快照存入账号池！`);
          loadAccounts();
        } else {
          showToast(`快照保存失败: ${data.message}`, 'error');
        }
      } catch (err) {
        showToast('快照保存异常: ' + err, 'error');
      }
    }

    async function deleteAccount(accId, email) {
      if (!confirm(`确定要从账号池中移除 [${email}] 吗？`)) return;
      try {
        const res = await fetch('/api/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_id: accId })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`已从账号池移除: ${email}`);
          loadAccounts();
        } else {
          showToast(`移除失败: ${data.message}`, 'error');
        }
      } catch (err) {
        showToast('移除异常: ' + err, 'error');
      }
    }

    function openAddModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
      if (oauthPollTimer) {
        clearInterval(oauthPollTimer);
        oauthPollTimer = null;
      }
    }

    function switchAddTab(tab) {
      if (tab === 'oauth') {
        document.getElementById('tab-oauth-btn').className = 'flex-1 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold transition';
        document.getElementById('tab-token-btn').className = 'flex-1 py-1.5 rounded-lg text-gray-400 hover:text-white transition';
        document.getElementById('tab-oauth-content').classList.remove('hidden');
        document.getElementById('tab-token-content').classList.add('hidden');
      } else {
        document.getElementById('tab-token-btn').className = 'flex-1 py-1.5 rounded-lg bg-indigo-600 text-white font-semibold transition';
        document.getElementById('tab-oauth-btn').className = 'flex-1 py-1.5 rounded-lg text-gray-400 hover:text-white transition';
        document.getElementById('tab-token-content').classList.remove('hidden');
        document.getElementById('tab-oauth-content').classList.add('hidden');
      }
    }

    async function startOAuthFlow() {
      const btn = document.getElementById('oauth-start-btn');
      const statusText = document.getElementById('oauth-status-text');
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> <span>已唤起浏览器，请在网页中完成授权...</span>';
      statusText.innerText = '正在本地监听 43210 端口接收 Google 回调...';

      try {
        await fetch('/api/start-oauth', { method: 'POST' });
        // 开启轮询状态
        if (!oauthPollTimer) {
          oauthPollTimer = setInterval(async () => {
            try {
              const res = await fetch('/api/oauth-status');
              const d = await res.json();
              if (d.completed) {
                clearInterval(oauthPollTimer);
                oauthPollTimer = null;
                showToast(`授权添加成功！账号: ${d.email}`);
                closeAddModal();
                loadAccounts();
              }
            } catch (_) {}
          }, 1500);
        }
      } catch (err) {
        showToast('唤起授权异常: ' + err, 'error');
        btn.innerHTML = '<i class="fa-brands fa-google"></i> <span>唤起浏览器一键授权</span>';
      }
    }

    async function submitToken() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) {
        alert('请输入 Refresh Token');
        return;
      }
      try {
        const res = await fetch('/api/add-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: token })
        });
        const d = await res.json();
        if (d.success) {
          showToast(`成功添加账号: ${d.email}`);
          closeAddModal();
          loadAccounts();
        } else {
          showToast(`添加失败: ${d.message}`, 'error');
        }
      } catch (err) {
        showToast('提交 Token 异常: ' + err, 'error');
      }
    }

    // 初始加载
    loadAccounts();
    // 每 60 秒静默轮询刷新一次
    setInterval(loadAccounts, 60000);
  </script>
</body>
</html>
