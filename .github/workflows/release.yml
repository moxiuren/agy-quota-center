name: Release Build (Windows + macOS)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "AGY_Quota_Center_${tag}_windows-x64.exe"
          Copy-Item "target/release/agy-quota-center.exe" $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "src-rust/AGY_Quota_Center_${{ github.ref_name }}_windows-x64.exe"

  build-macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        run: |
          TAG="${{ github.ref_name }}"
          OUT="agy-quota-center-${TAG}-macos-arm64"
          mkdir -p "$OUT"
          cp "target/aarch64-apple-darwin/release/agy-quota-center" "$OUT/"
          cp ../README.md "$OUT/" 2>/dev/null || true
          cp ../LICENSE "$OUT/" 2>/dev/null || true
          tar -czf "../${OUT}.tar.gz" "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: "agy-quota-center-${{ github.ref_name }}-macos-arm64.tar.gz"

  build-macos-x64:
    name: macOS Intel (x64)
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: src-rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build release
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          TAG="${{ github.ref_name }}"
          OUT="agy-quota-center-${TAG}-macos-x64"
          mkdir -p "$OUT"
          cp "target/x86_64-apple-darwin/release/agy-quota-center" "$OUT/"
          cp ../README.md "$OUT/" 2>/dev/null || true
          cp ../LICENSE "$OUT/" 2>/dev/null || true
          tar -czf "../${OUT}.tar.gz" "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: "agy-quota-center-${{ github.ref_name }}-macos-x64.tar.gz"

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-x64, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AGY_Quota_Center_*.exe
            agy-quota-center-*.tar.gz
          generate_release_notes: true
